name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish Grabby.app
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate (optional)
        if: env.HAS_CERTIFICATE == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm cert.p12

      - name: Bundle and sign
        run: GRABBY_SIGN_IDENTITY="${SIGN_IDENTITY:--}" scripts/bundle.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Grabby.app Grabby.app.zip
          shasum -a 256 Grabby.app.zip > Grabby.app.zip.sha256
          cat Grabby.app.zip.sha256

      - name: Release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Grabby $GITHUB_REF_NAME" > notes.md; fi
          {
            echo
            echo "Signed: $([ -n "$SIGN_IDENTITY" ] && echo 'Developer ID' || echo 'ad hoc (first launch: right-click, Open)')."
            echo "Requires macOS 26 or later and Accessibility access."
          } >> notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Grabby.app.zip
            build/Grabby.app.zip.sha256
          body_path: notes.md
